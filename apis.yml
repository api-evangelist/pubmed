apis:
- name: PubMed Central OA API
  description: >-
    The PMC Open Access API provides citation data, license information, and download links for Open Access
    articles in PubMed Central. Supports filtering by date and license type, returning FTP and HTTPS links
    to full-text XML and PDF files.
  image: https://www.ncbi.nlm.nih.gov/coreutils/img/ncbilogo.png
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/developers/
  baseURL: https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi
