- name: PMC ID Converter API
  description: >-
    The PMC ID Converter API translates between different article identifier formats including PubMed
    IDs (PMIDs), PubMed Central IDs (PMCIDs), Digital Object Identifiers (DOIs), and manuscript IDs. Essential
    for cross-referencing articles across databases and citation systems.
  image: https://www.ncbi.nlm.nih.gov/coreutils/img/ncbilogo.png
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/developers/
  baseURL: https://pmc.ncbi.nlm.nih.gov/tools/idconv/api/v1/articles/
