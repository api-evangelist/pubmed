- name: PMC BioC API
  description: >-
    The BioC API provides full text retrieval of PubMed Central Open Access articles in BioC XML or JSON
    format, optimized for natural language processing (NLP) and text mining applications. Supports article-level
    and passage-level access to structured article content.
  image: https://www.ncbi.nlm.nih.gov/coreutils/img/ncbilogo.png
  humanURL: https://pmc.ncbi.nlm.nih.gov/tools/developers/
  baseURL: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi
